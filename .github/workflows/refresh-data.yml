name: Weekly data refresh

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency: refresh-data

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 30 until SP3: the simulator adds a fifth and sixth model to retrain and
    # a Monte Carlo pass over every training row to measure the displayed
    # splits' calibration, together a few minutes more.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      # Asks BOTH sources whether anything happened: the Kaggle mirror it
      # downloads, compared against the primary-sourced processed rows, and
      # the daily ufcstats scrape's event list, compared against the whole
      # processed table. Either one running ahead sets refresh=true.
      - name: Check both sources for new fights
        id: refresh
        # Uncomment these two lines and add KAGGLE_USERNAME / KAGGLE_KEY as
        # repo secrets if anonymous Kaggle access fails in CI.
        # env:
        #   KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        #   KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          python scripts/refresh_data.py | tee "$RUNNER_TEMP/refresh_output.txt"
          grep '^REFRESH_NEEDED=' "$RUNNER_TEMP/refresh_output.txt" | sed 's/REFRESH_NEEDED=/refresh=/' >> "$GITHUB_OUTPUT"

      # Builds from the UNION of the two sources. The daily ufcstats scrape
      # (Greco1899/scrape_ufc_stats, GPL-3.0, used as data only -- its
      # published CSVs are fetched over HTTPS, no GPL code is vendored) is a
      # standing stage inside this script, not a separate writing step: every
      # rebuild fetches both and merges, so no rebuild can drop what a
      # previous one added and the script's own regression guard keeps its
      # meaning. The primary wins on any fight both sources have.
      #
      # No continue-on-error, and none is wanted: the merge is fail-soft in
      # the script itself. An unreachable host, a renamed column or a source
      # that disagrees with ours degrades to a primary-only build with a
      # warning on stderr, so this step going red means a genuine data
      # problem rather than someone else's outage.
      - name: Rebuild processed dataset (Kaggle + daily scrape)
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/make_dataset.py

      - name: Rebuild Elo ratings
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/build_ratings.py

      - name: Rebuild features
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/build_features.py

      - name: Retrain XGBoost models
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/train_xgb.py

      - name: Retrain torch ensemble
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/train_torch.py

      - name: Retrain the simulator's hazard and decision models
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/train_hazard.py

      # Measurement, not a correction: the app shows the simulator's raw
      # marginals, and this records how far they sit from the historical base
      # rates on the model's own training rows. A retrain that broke that
      # calibration would show up in a committed diff.
      - name: Measure display calibration
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/check_display_calibration.py

      # The other weekly measurement, and the one that ages rather than
      # breaks. The external/notice/context blocks all read one STATIC
      # snapshot (ehan03/jds-mma-data, UFC coverage to 2024-12-14), so the
      # share of rows it has never seen grows with every event. Report-only,
      # like the calibration check above: it puts the number in a committed
      # diff and warns on stderr once the trailing 12 months are less covered
      # than the fold the block was last judged on.
      - name: Measure external-snapshot coverage
        if: steps.refresh.outputs.refresh == 'true'
        continue-on-error: true
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/check_snapshot_coverage.py

      - name: Run test suite
        if: steps.refresh.outputs.refresh == 'true'
        env:
          OMP_NUM_THREADS: "1"
        run: pytest -q

      - name: Commit and push refreshed data
        if: steps.refresh.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Weekly data refresh"
            git push
          else
            echo "no changes to commit"
          fi

      # Everything below runs EVERY week regardless of whether either source
      # had new data -- prospective predictions and grading don't depend on a
      # data refresh happening, and this is the project's flagship
      # credibility feature (timestamped predictions, committed before
      # events, graded automatically after). Grading is the step the daily
      # scrape most directly serves: it can only grade a fight the tables
      # already have, and the tables now reach within days of the card
      # instead of within weeks.
      - name: Predict upcoming events
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/predict_upcoming.py

      - name: Grade past predictions
        if: always()
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/grade_predictions.py

      # Replaces the retired promotion gate's dry run (scripts/roll_window.py).
      # There is no promotion to gate: this Action refits every member on all
      # data whenever new fights arrive, so the fresh fit IS the incumbent.
      # What CAN go wrong silently is that the recipe's justification ages --
      # every walk-forward report behind it was computed on an older table,
      # and the models keep training past it. The same refresh also retires
      # the walk-forward prediction dump that models/market_benchmark_oof.json
      # is rebuilt from (the join is positional, so a dump belongs to the table
      # it was written from), and nothing runs that benchmark on a schedule --
      # so this step reports that pairing too.
      #
      # This step reads dates and fits nothing (a second or two). The full
      # re-validation (`scripts/revalidate_recipe.py` with no flags) re-runs
      # six harness runs, takes several minutes on top of an already 45-minute
      # job, and WRITES A DECISION ARTIFACT -- so running it weekly would both
      # cost every run a re-measurement almost nothing has changed, and turn a
      # human's call about the deployed recipe into a side effect of a cron
      # job. It stays human-triggered; this step is the trigger's signal.
      - name: Check how stale the recipe's evidence and the market benchmark are (report only)
        if: always()
        env:
          OMP_NUM_THREADS: "1"
        run: python scripts/revalidate_recipe.py --check-staleness

      - name: Commit and push predictions
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain predictions/)" ]; then
            git add predictions/
            git commit -m "Weekly predictions and grading"
            git push
          else
            echo "no prediction changes to commit"
          fi
