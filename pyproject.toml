[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma"
version = "0.1.0"
description = "UFC fight outcome prediction: Elo -> XGBoost -> PyTorch"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    # 3.0+: the served blend's XGBoost member matches categoricals BY VALUE.
    # XGBoost 2.x matches by CODE, and a one-row served matchup's category codes
    # are not the training frame's -- a silently wrong weight_class, not an
    # error. See mma.models.xgb.align_to_booster.
    "xgboost>=3.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "kagglehub>=0.3",
]
app = [
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
